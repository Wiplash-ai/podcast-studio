server {
  listen 8080;
  server_name _;
  access_log off;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;
  # Rich room chat is capped again by the authenticated API route. Other JSON
  # routes retain Fastify's much smaller default body limit.
  client_max_body_size 25m;

  location = /gateway-healthz {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 200 '{"ok":true,"service":"podcast-studio-gateway"}\n';
  }

  # Fixture and retention controls are container-network-only API contracts.
  location ^~ /internal/ {
    return 404;
  }

  location /v1/ {
    proxy_pass http://api:8788;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
  }

  location = /healthz {
    proxy_pass http://api:8788/healthz;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
  }

  location = /sw.js {
    try_files /sw.js =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /manifest.webmanifest {
    try_files /manifest.webmanifest =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    # Dynamic React style attributes require inline styles today. Scripts stay
    # self-only, while secure API/media endpoints and the VDO.Ninja room frame
    # remain available. child-src preserves the frame/worker policy on older
    # WebKit versions that predate the dedicated directives.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https: wss:; media-src 'self' blob: https:; frame-src 'self' https://vdo.ninja; worker-src 'self' blob:; child-src 'self' blob: https://vdo.ninja; manifest-src 'self'; form-action 'self'; upgrade-insecure-requests" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }
}
