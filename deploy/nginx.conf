server {
  listen 8080;
  server_name _;
  access_log off;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;
  # Rich room chat is capped again by the authenticated API route. Other JSON
  # routes retain Fastify's much smaller default body limit.
  client_max_body_size 25m;

  location = /gateway-healthz {
    default_type application/json;
    return 200 '{"ok":true,"service":"podcast-studio-gateway"}\n';
  }

  # Fixture and retention controls are container-network-only API contracts.
  location ^~ /internal/ {
    return 404;
  }

  location /v1/ {
    proxy_pass http://api:8788;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /healthz {
    proxy_pass http://api:8788/healthz;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
  }
}
